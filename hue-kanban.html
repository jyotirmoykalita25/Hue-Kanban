<style>
  :root {
    --ink: #0D0E13;
    --panel-top: #21252F;
    --panel-bottom: #171A22;
    --panel-border: rgba(255, 255, 255, 0.07);
    --paper-top: #F3EEE2;
    --paper-bottom: #E9E3D4;
    --ochre: #D9973F;
    --ochre-soft: rgba(217, 151, 63, 0.45);
    --text: #EDEAE1;
    --text-dim: #8A8E9B;
    --text-faint: rgba(237, 234, 225, 0.4);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
            "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: 26px 40px 20px;
    font-family: var(--font);
    color: var(--text);
    background:
      radial-gradient(1100px 700px at 12% -12%, #262b3b 0%, transparent 60%),
      radial-gradient(900px 650px at 105% 112%, #1b2029 0%, transparent 55%),
      var(--ink);
  }

  .topbar {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    margin-bottom: 18px;
  }

  h1 {
    font-weight: 650;
    font-size: 24px;
    margin: 0;
    letter-spacing: -0.01em;
    justify-self: start;
    background: linear-gradient(120deg, #F0C381 0%, #D9973F 50%, #C2703B 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .clock {
    justify-self: center;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    color: var(--text-dim);
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .clock .time {
    color: var(--text);
    font-weight: 600;
    font-size: 14px;
  }

  .clock .dot {
    opacity: 0.35;
  }

  .board {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    min-height: 0;
  }

  .active-label {
    font-size: 11.5px;
    color: var(--text-dim);
    letter-spacing: 0.03em;
  }

  .daily-value {
    color: var(--text);
    font-weight: 600;
    font-size: 14px;
  }

  .column {
    background: linear-gradient(165deg, var(--panel-top) 0%, var(--panel-bottom) 100%);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 16px 15px 14px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 24px 44px -26px rgba(0, 0, 0, 0.65);
    transition: outline 100ms ease;
  }

  .column.drag-over { background: linear-gradient(165deg, #262b37 0%, #1a1d26 100%); }
  .column.drag-blocked { outline: 1px dashed rgba(214, 96, 84, 0.55); outline-offset: -4px; }

  .col-head {
    flex: 0 0 auto;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    padding-bottom: 10px;
  }

  .col-head::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: -1px;
    height: 1px;
    background: linear-gradient(90deg, var(--ochre-soft), rgba(217, 151, 63, 0) 75%);
  }

  .col-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .col-count {
    font-size: 11px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    background: rgba(255, 255, 255, 0.06);
    padding: 3px 8px;
    border-radius: 999px;
  }

  .cards {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .card {
    background: linear-gradient(155deg, var(--paper-top) 0%, var(--paper-bottom) 100%);
    color: var(--ink);
    border-radius: 8px;
    padding: 8px 14px 8px 6px;
    cursor: grab;
    line-height: 1.15;
    word-break: break-word;
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 4px;
    box-shadow: 0 6px 14px -9px rgba(0, 0, 0, 0.5), 0 1px 0 rgba(255, 255, 255, 0.5) inset;
    transition: transform 100ms ease, opacity 200ms ease, filter 200ms ease, box-shadow 120ms ease;
  }

  .card:hover { box-shadow: 0 8px 18px -9px rgba(0, 0, 0, 0.55), 0 1px 0 rgba(255, 255, 255, 0.5) inset; }

  .card.blurred { display: none; }

  .card.dragging { opacity: 0.35; }

  .card:active { cursor: grabbing; }

  .drag-handle {
    flex: 0 0 auto;
    width: 16px;
    padding-top: 2px;
    font-size: 13px;
    line-height: 1;
    color: var(--ink);
    opacity: 0.28;
    user-select: none;
    letter-spacing: -1px;
  }

  .card:hover .drag-handle { opacity: 0.55; }

  .star-toggle {
    flex: 0 0 auto;
    padding-top: 2px;
    cursor: pointer;
    color: var(--ink);
    opacity: 0;
    user-select: none;
    transition: opacity 100ms ease, transform 80ms ease;
    font-size: 0.78em;
    line-height: 1;
  }

  .card:hover .star-toggle { opacity: 0.25; }
  .star-toggle:hover { opacity: 0.6; }
  .star-toggle.active { color: var(--ochre); opacity: 1 !important; }
  .star-toggle.active:hover { transform: scale(0.85); }

  .card-body { flex: 1; min-width: 0; }

  .card-text {
    cursor: text;
    min-width: 0;
    font-weight: 500;
  }

  .card-text:focus {
    outline: 2px solid var(--ochre);
    outline-offset: 2px;
    border-radius: 2px;
  }

  .card-meta {
    display: flex;
    gap: 10px;
    margin-top: 4px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.01em;
    color: rgba(13, 14, 19, 0.5);
  }

  .card-timer.running { color: var(--ink); opacity: 0.75; font-weight: 600; }
  .card-timer.overtime { color: #B14A2C; font-weight: 700; }

  .card .remove {
    position: absolute;
    top: 6px;
    right: 8px;
    font-size: 13px;
    color: var(--ink);
    opacity: 0;
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 4px;
    line-height: 1;
    transition: opacity 100ms ease;
  }

  .card:hover .remove { opacity: 0.35; }
  .card .remove:hover { opacity: 0.85 !important; }

  .add-row {
    flex: 0 0 auto;
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .add-row input {
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--text);
    font-family: var(--font);
    font-size: 12.5px;
  }

  .add-row input::placeholder { color: var(--text-faint); }

  .add-row input:focus {
    outline: none;
    border-color: var(--ochre);
    box-shadow: 0 0 0 3px rgba(217, 151, 63, 0.15);
  }

  .add-row input[type="text"] { flex: 1 1 90px; min-width: 70px; }
  .add-row input[type="date"] { flex: 0 0 112px; color-scheme: dark; font-size: 11.5px; padding: 8px 6px; }

  .duration-input {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 3px;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 8px;
    padding: 8px 9px;
    transition: border-color 100ms ease, box-shadow 100ms ease;
  }

  .duration-input:focus-within {
    border-color: var(--ochre);
    box-shadow: 0 0 0 3px rgba(217, 151, 63, 0.15);
  }

  .duration-input.disabled {
    opacity: 0.35;
    pointer-events: none;
  }

  .duration-input input[type="number"] {
    background: transparent;
    border: none;
    padding: 0;
    width: 20px;
    text-align: center;
    color: var(--text);
    font-family: var(--font);
    font-variant-numeric: tabular-nums;
    font-size: 12.5px;
    -moz-appearance: textfield;
  }

  .duration-input input[type="number"]::-webkit-outer-spin-button,
  .duration-input input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .duration-input input[type="number"]:focus { outline: none; }

  .duration-sep {
    color: var(--text-dim);
    font-weight: 600;
    font-size: 12px;
  }

  .add-row input:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .add-row button {
    background: linear-gradient(135deg, #E7A855, #C2703B);
    color: #1A130A;
    border: none;
    border-radius: 8px;
    padding: 0 14px;
    font-family: var(--font);
    font-size: 12.5px;
    font-weight: 650;
    cursor: pointer;
    box-shadow: 0 4px 10px -4px rgba(194, 112, 59, 0.55);
    transition: filter 100ms ease;
  }

  .add-row button:hover { filter: brightness(1.07); }

  .add-row button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    box-shadow: none;
  }

  footer {
    flex: 0 0 auto;
    margin-top: 14px;
    color: var(--text-faint);
    font-size: 11.5px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>Hue</h1>
  <div class="clock" id="clock"><span class="time" id="clockTime"></span><span class="dot">·</span><span id="clockDate"></span><span class="dot">·</span><span class="active-label">Active</span><span class="daily-value" id="dailyTimerValue">00:00:00</span></div>
  <div></div>
</div>

<div class="board" id="board"></div>

<footer>Drag within or across columns to reorder — 5 tasks max per column. Click a task to rename it, or the faint star to mark it high priority.</footer>

<script>
const MAX_TASKS = 5;

function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

const loaded = loadFromStorage();

const COLUMNS = (loaded && loaded.columns) || [
  { id: 'todo', title: 'To do', tasks: [] },
  { id: 'doing', title: 'Doing', tasks: [] },
  { id: 'done', title: 'Done', tasks: [] },
];

let DAILY = (loaded && loaded.daily) || { date: todayKey(), seconds: 0, runningSince: null };

const STORAGE_KEY = 'the-desk-kanban-data';

function loadFromStorage() {
  try {
    const raw = localStorage.getItem('the-desk-kanban-data');
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed)) return { columns: parsed, daily: null };
    if (parsed && Array.isArray(parsed.columns)) return { columns: parsed.columns, daily: parsed.daily || null };
    return null;
  } catch (e) {
    return null;
  }
}

function saveToStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ columns: COLUMNS, daily: DAILY }));
  } catch (e) {
    // storage unavailable (private browsing, sandboxed preview, etc.) — fail silently
  }
}

function t() { return 'id' + Math.random().toString(36).slice(2, 10); }

const MAX_SIZE = 32, MIN_SIZE = 16, STEP = 4;

function sizeFor(index) {
  return Math.max(MIN_SIZE, MAX_SIZE - index * STEP);
}

const board = document.getElementById('board');

function render() {
  checkDailyRollover();
  freezeAllTimers();
  resumeDoingTimers();
  syncDailyRunningState();
  updateActiveDisplay();
  board.innerHTML = '';

  COLUMNS.forEach(col => {
    const colEl = document.createElement('div');
    colEl.className = 'column';
    colEl.dataset.col = col.id;
    const atCap = col.tasks.length >= MAX_TASKS;

    colEl.innerHTML = `
      <div class="col-head">
        <span class="col-title">${col.title}</span>
        <span class="col-count">${col.tasks.length} / ${MAX_TASKS}</span>
      </div>
      <div class="cards" data-col="${col.id}"></div>
      <div class="add-row">
        <input type="text" placeholder="New task" data-add="${col.id}" ${atCap ? 'disabled' : ''}>
        <input type="date" data-adddate="${col.id}" ${atCap ? 'disabled' : ''}>
        <div class="duration-input${atCap ? ' disabled' : ''}">
          <input type="number" min="0" max="99" placeholder="00" data-addhrs="${col.id}" ${atCap ? 'disabled' : ''}>
          <span class="duration-sep">:</span>
          <input type="number" min="0" max="59" placeholder="00" data-addmins="${col.id}" ${atCap ? 'disabled' : ''}>
        </div>
        <button data-addbtn="${col.id}" ${atCap ? 'disabled' : ''}>Add</button>
      </div>
    `;

    const cardsEl = colEl.querySelector('.cards');

    col.tasks.forEach((task, i) => {
      cardsEl.appendChild(makeCard(col.id, task, i));
    });

    colEl.addEventListener('dragover', e => {
      e.preventDefault();
      const draggingEl = document.querySelector('.card.dragging');
      if (!draggingEl) return;

      const alreadyHere = cardsEl.contains(draggingEl);
      const otherCount = cardsEl.querySelectorAll('.card:not(.dragging)').length;

      if (!alreadyHere && otherCount >= MAX_TASKS) {
        colEl.classList.remove('drag-over');
        colEl.classList.add('drag-blocked');
        return;
      }

      colEl.classList.remove('drag-blocked');
      colEl.classList.add('drag-over');
      const afterElement = getDragAfterElement(cardsEl, e.clientY);
      if (afterElement == null) {
        cardsEl.appendChild(draggingEl);
      } else {
        cardsEl.insertBefore(draggingEl, afterElement);
      }
    });
    colEl.addEventListener('dragleave', e => {
      if (!colEl.contains(e.relatedTarget)) {
        colEl.classList.remove('drag-over');
        colEl.classList.remove('drag-blocked');
      }
    });
    colEl.addEventListener('drop', e => {
      e.preventDefault();
      colEl.classList.remove('drag-over');
      colEl.classList.remove('drag-blocked');
    });

    board.appendChild(colEl);
  });

  board.querySelectorAll('[data-addbtn]').forEach(btn => {
    btn.addEventListener('click', () => addTask(btn.dataset.addbtn));
  });
  board.querySelectorAll('[data-add]').forEach(input => {
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') addTask(input.dataset.add);
    });
  });

  updateBlur();
  saveToStorage();
}

function updateBlur() {
  const doingCol = COLUMNS.find(c => c.id === 'doing');
  const shouldBlur = doingCol.tasks.length > 0;
  const todoCardsEl = board.querySelector('.column[data-col="todo"] .cards');
  if (!todoCardsEl) return;
  todoCardsEl.querySelectorAll('.card').forEach(card => {
    card.classList.toggle('blurred', shouldBlur);
  });
}

function makeCard(colId, task, index) {
  const el = document.createElement('div');
  el.className = 'card';
  el.draggable = true;
  el.style.fontSize = sizeFor(index) + 'px';
  el.dataset.taskId = task.id;
  el.dataset.col = colId;

  const handle = document.createElement('div');
  handle.className = 'drag-handle';
  handle.innerText = '⠿';
  handle.title = 'Drag to reorder';
  el.appendChild(handle);

  const star = document.createElement('div');
  star.className = 'star-toggle' + (task.priority ? ' active' : '');
  star.innerText = '★';
  star.title = task.priority ? 'Unmark as high priority' : 'Mark as high priority';
  star.addEventListener('mousedown', e => e.stopPropagation());
  star.addEventListener('click', e => {
    e.stopPropagation();
    task.priority = !task.priority;
    render();
  });
  el.appendChild(star);

  const text = document.createElement('div');
  text.className = 'card-text';
  text.contentEditable = 'true';
  text.spellcheck = false;
  text.innerText = task.text;

  text.addEventListener('mousedown', e => e.stopPropagation());
  text.addEventListener('blur', () => {
    task.text = text.innerText.trim() || task.text;
    render();
  });
  text.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); text.blur(); }
  });

  const body = document.createElement('div');
  body.className = 'card-body';
  body.appendChild(text);

  if (task.date || task.durationMinutes) {
    const meta = document.createElement('div');
    meta.className = 'card-meta';

    if (task.date) {
      const dateEl = document.createElement('span');
      dateEl.innerText = formatDate(task.date);
      meta.appendChild(dateEl);
    }

    if (task.durationMinutes) {
      const timerEl = document.createElement('span');
      timerEl.className = 'card-timer';
      const value = effectiveValue(task);
      if (task.runningSince) timerEl.classList.add('running');
      if (value <= 0) timerEl.classList.add('overtime');
      timerEl.innerText = formatSigned(value);
      meta.appendChild(timerEl);
    }

    body.appendChild(meta);
  }
  el.appendChild(body);

  el.addEventListener('dragstart', e => {
    el.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  el.addEventListener('dragend', () => {
    el.classList.remove('dragging');
    document.querySelectorAll('.column').forEach(c => {
      c.classList.remove('drag-over');
      c.classList.remove('drag-blocked');
    });
    syncFromDOM();
  });

  const remove = document.createElement('button');
  remove.className = 'remove';
  remove.innerText = '×';
  remove.title = 'Remove task';
  remove.addEventListener('mousedown', e => e.stopPropagation());
  remove.addEventListener('click', e => {
    e.stopPropagation();
    const col = COLUMNS.find(c => c.id === colId);
    col.tasks = col.tasks.filter(tk => tk.id !== task.id);
    render();
  });
  el.appendChild(remove);

  return el;
}

function getDragAfterElement(cardsEl, y) {
  const els = [...cardsEl.querySelectorAll('.card:not(.dragging)')];
  return els.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) {
      return { offset, element: child };
    }
    return closest;
  }, { offset: -Infinity, element: null }).element;
}

function syncFromDOM() {
  const idToTask = {};
  COLUMNS.forEach(c => c.tasks.forEach(tk => { idToTask[tk.id] = tk; }));

  document.querySelectorAll('.column').forEach(colEl => {
    const col = COLUMNS.find(c => c.id === colEl.dataset.col);
    const newTasks = [];
    colEl.querySelectorAll('.card').forEach(cardEl => {
      const task = idToTask[cardEl.dataset.taskId];
      if (task) newTasks.push(task);
    });
    col.tasks = newTasks;
  });

  render();
}

function formatDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function formatClock(totalSeconds) {
  const s = Math.max(0, totalSeconds);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const r = s % 60;
  if (h > 0) {
    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
  }
  return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
}

function addTask(colId) {
  const col = COLUMNS.find(c => c.id === colId);
  if (col.tasks.length >= MAX_TASKS) return;

  const input = document.querySelector(`input[data-add="${colId}"]`);
  const dateInput = document.querySelector(`input[data-adddate="${colId}"]`);
  const hrsInput = document.querySelector(`input[data-addhrs="${colId}"]`);
  const minsInput = document.querySelector(`input[data-addmins="${colId}"]`);
  const text = input.value.trim();
  if (!text) return;

  const hrs = parseInt(hrsInput.value, 10) || 0;
  const mins = parseInt(minsInput.value, 10) || 0;
  const totalMins = hrs * 60 + mins;

  const task = { id: t(), text, priority: false, date: dateInput.value || null };
  if (totalMins > 0) {
    task.durationMinutes = totalMins;
    task.remainingSeconds = totalMins * 60;
    task.runningSince = null;
  }
  col.tasks.push(task);
  input.value = '';
  dateInput.value = '';
  hrsInput.value = '';
  minsInput.value = '';
  render();
}

// Wall-clock-based countdown: remainingSeconds is the frozen baseline (can go
// negative once the timer runs past zero), and runningSince marks when it last
// started counting. Displayed time is always recomputed from real elapsed time,
// so throttled/paused background tabs can't cause drift. Once past zero the
// timer keeps running as an "uptime" counter showing how long it's overrun.
function effectiveValue(task) {
  const base = task.remainingSeconds || 0;
  if (!task.runningSince) return base;
  const elapsed = Math.floor((Date.now() - task.runningSince) / 1000);
  return base - elapsed;
}

function formatSigned(value) {
  if (value < 0) return '+' + formatClock(-value);
  return formatClock(value);
}

function effectiveDailyValue() {
  if (!DAILY.runningSince) return DAILY.seconds;
  const elapsed = Math.floor((Date.now() - DAILY.runningSince) / 1000);
  return DAILY.seconds + elapsed;
}

function formatHMS(totalSeconds) {
  const s = Math.max(0, Math.floor(totalSeconds));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const r = s % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
}

function updateActiveDisplay() {
  const el = document.getElementById('dailyTimerValue');
  if (el) el.innerText = formatHMS(effectiveDailyValue());
}

function checkDailyRollover() {
  const today = todayKey();
  if (DAILY.date !== today) {
    DAILY = { date: today, seconds: 0, runningSince: DAILY.runningSince ? Date.now() : null };
  }
}

function syncDailyRunningState() {
  const doingCol = COLUMNS.find(c => c.id === 'doing');
  const shouldRun = doingCol.tasks.length > 0;
  if (shouldRun && !DAILY.runningSince) {
    DAILY.runningSince = Date.now();
  } else if (!shouldRun && DAILY.runningSince) {
    DAILY.seconds = effectiveDailyValue();
    DAILY.runningSince = null;
  }
}

function freezeAllTimers() {
  COLUMNS.forEach(col => col.tasks.forEach(task => {
    if (task.durationMinutes && task.runningSince) {
      task.remainingSeconds = effectiveValue(task);
      task.runningSince = null;
    }
  }));
}

function resumeDoingTimers() {
  const doingCol = COLUMNS.find(c => c.id === 'doing');
  doingCol.tasks.forEach(task => {
    if (task.durationMinutes && !task.runningSince) {
      task.runningSince = Date.now();
    }
  });
}

function tickTimers() {
  checkDailyRollover();

  const doingCol = COLUMNS.find(c => c.id === 'doing');
  let anyRunning = false;
  doingCol.tasks.forEach(task => {
    if (task.durationMinutes && task.runningSince) {
      anyRunning = true;
      const value = effectiveValue(task);
      const timerEl = board.querySelector(`.card[data-task-id="${task.id}"] .card-timer`);
      if (timerEl) {
        timerEl.innerText = formatSigned(value);
        timerEl.classList.toggle('overtime', value <= 0);
      }
    }
  });

  updateActiveDisplay();

  if (anyRunning || DAILY.runningSince) saveToStorage();
}

function updateClock() {
  const now = new Date();
  const time = now.toLocaleTimeString('en-GB', { hour12: false });
  const weekday = now.toLocaleDateString(undefined, { weekday: 'long' });
  const date = now.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  document.getElementById('clockTime').innerText = time;
  document.getElementById('clockDate').innerText = `${weekday} · ${date}`;
}

setInterval(tickTimers, 1000);
setInterval(updateClock, 1000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') tickTimers();
});

updateClock();
render();
</script>
</body>
</html>
